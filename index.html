<!DOCTYPE html>
<html>
<head>
    <title>The City That Remembers</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="game">

    <div class="top">
        <h2>The City That Remembers</h2>
        <p id="message">Explore the city...</p>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div class="controls">

        <div>
            <button onclick="movePlayer(0, -1)">▲</button>
        </div>

        <div>
            <button onclick="movePlayer(-1, 0)">◀</button>
            <button onclick="interact()">●</button>
            <button onclick="movePlayer(1, 0)">▶</button>
        </div>

        <div>
            <button onclick="movePlayer(0, 1)">▼</button>
        </div>

    </div>

</div>

<script src="game.js"></script>

</body>
</html>
